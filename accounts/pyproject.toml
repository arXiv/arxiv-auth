[project]
name = "accounts"
version = "1.1.0"
description = "common auth parts of arXiv"
authors = [{ name = "arxiv.org" }]
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arxiv-base>=1.0.0a2,<2",
    "bleach>=3.3.0,<4",
    "captcha>=0.4,<0.5",
    "celery>=5.1.2,<6",
    "cryptography>=3.3.2,<4",
    "email-validator>=1.2.1,<2",
    "jsonschema>=4.9.1,<5",
    "openapi-spec-validator>=0.5.0a2,<0.6",
    "pillow>=9.2.0,<10",
    "pycountry>=22.3.5,<23",
    "python-dateutil>=2.8.2,<3",
    "redis>=2.10.6,<3",
    "redis-py-cluster>=1.3.6,<2",
    "requests>=2.28.1,<3",
    "urllib3>=1.26.11,<2",
    "arxiv-auth",
]

[dependency-groups]
dev = [
    "mimesis",
    "mypy",
    "pydocstyle",
    "pylint",
    "coverage",
    "coveralls",
    "pytest",
    "pytest-cov",
    "astroid",
    "nose2",
    "hypothesis>=6.54.3,<7",
    "fakeredis>=1.9.0,<2",
]

[tool.uv]

[tool.uv.sources]
arxiv-auth = { path = "../arxiv-auth" }

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
