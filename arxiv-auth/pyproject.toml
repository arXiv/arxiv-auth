[project]
name = "arxiv-auth"
version = "1.0.0rc3"
description = "Auth libraries for arXiv."
authors = [{ name = "arxiv.org" }]
requires-python = ">=3.11,<4"

dependencies = [
    "pycountry",
    "flask",
    "sqlalchemy",
    "flask-sqlalchemy",
    "mimesis",
    "mysqlclient",
    "python-dateutil",
    "pyjwt",
    "redis==2.10.6",
    "redis-py-cluster==1.3.6",
    "pydantic",
    "arxiv-base",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "fakeredis",
    "pytest-mock>=3.8.2,<4",
    "pytest-cov>=3.0.0,<4",
    "mimesis",
    "mypy",
    "pydocstyle",
    "pylint",
    "hypothesis>=6.54.3,<7",
    "fakeredis>=1.9.0,<2",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
#arxiv-base = { git = "https://github.com/arXiv/arxiv-base", rev="8d74929e" }

# Didn't work: first werkzeug 3.0  problem, then something in arxiv/release/dist_version
#arxiv-base = { git = "https://github.com/arXiv/arxiv-base", branch="1.0.0a3" }

# base master  uses 3.11 but auth uses 3.10
# this has the Category change problem
arxiv-base = { git = "https://github.com/arXiv/arxiv-base", branch="master" }

[tool.coverage.run]
omit = [
    "**/tests/*",
    "**/tests_*.py",
    "venv/*",
    ".venv/*",
]
