name: Build and push arxiv-auth Login App

run-name: "Build arxiv-auth Login App ${{ github.ref_name }} ${{ github.sha }}"

on:
  push:
    branches:
      - main
      - develop
    # tags:
    #   - "RELEASE-*"
    paths:
      - "arxiv-auth/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "arxiv-auth/**"
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read
  pull-requests: write

env:
  DEPLOY_WORKFLOW: "deploy-login-app.yml"
  DOCKERFILE: "arxiv-auth/Dockerfile"
  GCP_PROJECT_ID: "arxiv-development"
  IMAGE_NAME: "login-app"
  PORT: "8080"
  TARGET: "runtime"

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check version
        run: terraform --version

      - name: Format check
        run: terraform fmt -check

  build-push:
    needs: format-check
    runs-on: ubuntu-latest

    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      
      # - uses: actions/setup-python@v6
      #   with:
      #     # python-version: "3.13"
      #     python-version-file: "metadata-checks/pyproject.toml"
          
      # - name: Install protoc dependency
      #   run: |
      #     sudo apt update
      #     sudo apt install -y protobuf-compiler
      #     protoc --version

      # - name: Install uv
      #   uses: astral-sh/setup-uv@v6

      # - name: Install the project
      #   run: uv sync --directory metadata-checks --locked --all-extras --dev

      # - name: Lint
      #   run: |
      #     uv run --directory metadata-checks ruff check --output-format=github .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ARXIV_DEVELOPMENT_PROVIDER_NAME }}
          service_account: ${{ vars.ARXIV_DEVELOPMENT_SERVICE_ACCOUNT }}

      # - name: Run tests
      #   # TODO: run tests at top level?
      #   run: |
      #     cd metadata-checks
      #     uv run --directory . pytest --cov-report=html --cov=metadata_checks --cov-fail-under=80 tests
        
      # - name: Upload coverage HTML report
      #   uses: actions/upload-artifact@v4
      #   if: success()
      #   with:
      #     name: coverage-report
      #     path: metadata-checks/htmlcov/
      #     retention-days: 30

      # Now (only if tests passed) build and deploy to cloud

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build image, caching from latest
        run: |
          #docker pull gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

          BRANCH_TAG="$(printf "%.128s" "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | sed 's/^[.-]*//')"

          docker build --target ${TARGET} --build-arg PORT=${PORT} --build-arg GIT_COMMIT=${{ github.sha }} -f ${DOCKERFILE} \
          --cache-from gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
          -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG} .
          # ${{ github.ref_name == 'main' && format('-t gcr.io/{0}/{1}:latest', env.GCP_PROJECT_ID, env.IMAGE_NAME) || '' }} .

      - name: Push image
        run: docker push --all-tags gcr.io/${GCP_PROJECT_ID}/${IMAGE_NAME}

  development:
    needs: build-push
    uses: ./.github/workflows/deploy-login-app.yml
    if: github.ref == 'refs/heads/main'
    #if: ${{ github.event_name != 'workflow_dispatch' && (github.base_ref == 'main' || github.ref_name == 'main') }}
    with:
      env: development
      image_tag: ${{ github.sha }}

  # staging:
  #   needs: build-push
  #   uses: ./.github/workflows/deploy-metadata-checks.yml
  #   if: ${{ startsWith(github.ref, 'refs/tags/RELEASE-') }}
  #   with:
  #     env: staging
  #     image_tag: ${{ github.sha }}

