version: '3'

services:
  accounts-redis-sessions:
    image: grokzen/redis-cluster:4.0.9
    container_name: accounts-redis-sessions
    networks:
      - arxiv-accounts
    ports:
      - '127.0.0.1:7000:7000'
      - '127.0.0.1:7001:7001'
      - '127.0.0.1:7002:7002'
      - '127.0.0.1:7003:7003'
      - '127.0.0.1:7004:7004'
      - '127.0.0.1:7005:7005'
      - '127.0.0.1:7006:7006'
    environment:
      IP: "0.0.0.0"

  accounts-maria:
    image: mariadb:10.3
    container_name: accounts-maria
    networks:
      - arxiv-accounts
    environment:
      MYSQL_USER: foouser
      MYSQL_PASSWORD: foopass
      MYSQL_ROOT_PASSWORD: foorootpassword
      MYSQL_DATABASE: accounts
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # logging:
    #   driver: none

  accounts:
    build:
      context: ./
      dockerfile: Dockerfile-accounts
    container_name: accounts
    environment:
      REDIS_HOST: "accounts-redis-sessions"
      REDIS_PORT: "7000"
      LOGLEVEL: 10
      CLASSIC_DATABASE_URI: "mysql+mysqldb://foouser:foopass@accounts-maria:3306/accounts?charset=utf8"
      JWT_SECRET: foosecret
      CAPTCHA_SECRET: foocaptchasecret
      CAPTCHA_FONT: /opt/arxiv/fonts/montserrat.ttf
      CREATE_DB: 1

    networks:
      - arxiv-accounts
    depends_on:
      - accounts-redis-sessions
      - accounts-maria

networks:
  arxiv-accounts:
